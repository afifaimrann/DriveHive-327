# ============================================
# DriveHive — Docker Compose
# ============================================
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up --build
#   3. Visit http://localhost:3000
# ============================================

services:
  drivehive:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drivehive-server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persist temporary upload/download directories
      - drivehive-uploads:/app/uploads
      - drivehive-downloads:/app/downloads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  drivehive-uploads:
  drivehive-downloads:
